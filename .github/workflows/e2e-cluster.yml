name: e2e-cluster

# Прогон со свежим кластером: поднимаем одноузловой кластер под этот запуск,
# гоняем сценарии, которым нужен настоящий кластер, и сносим его целиком.
# Уборка получается бесплатной и надёжной — платформа снимать выкатку пока не
# умеет, а тут вместе с машиной исчезает всё, что она успела туда положить.

on:
  # Расписание снято: облачная часть осталась на Yandex Cloud, после переезда
  # платформы в Selectel прогон падает на первом шаге. Вернуть после переноса
  # инфраструктуры прогона (EPIC-19).
  workflow_dispatch:

# Адрес и корневой сертификат у кластера одни на все прогоны, поэтому два
# одновременных запуска подрались бы за них.
concurrency:
  group: e2e-cluster
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Реквизиты — то, что прогон не может породить сам (README, «Реквизиты»).
      # Всё остальное — адрес, DNS, подключение кластера, продукт, зона — прогон
      # обеспечивает себе сам, каждый раз.
      E2E_CA_CRT: ${{ secrets.E2E_CA_CRT }}
      E2E_CA_KEY: ${{ secrets.E2E_CA_KEY }}
      E2E_PLATFORM_TOKEN: ${{ secrets.E2E_PLATFORM_TOKEN }}
      E2E_ADMIN_TOKEN: ${{ secrets.E2E_ADMIN_TOKEN }}
      E2E_GHCR_USER: ${{ secrets.E2E_GHCR_USER }}
      E2E_GHCR_TOKEN: ${{ secrets.E2E_GHCR_TOKEN }}
      E2E_GITHUB_INSTALLATION_ID: ${{ secrets.E2E_GITHUB_INSTALLATION_ID }}
      PAAS_API_TOKEN: ${{ secrets.PAAS_SANDBOX_API_TOKEN }}
      E2E_CLUSTER_NAME: ${{ vars.E2E_CLUSTER_NAME || 'paas-e2e' }}
      E2E_CLUSTER_HOST: ${{ vars.E2E_CLUSTER_HOST || 'e2e.traumtech.ru' }}
      E2E_SUBNET: ${{ vars.E2E_SUBNET || 'default-ru-central1-a' }}
      KUBECONFIG_OUT: ${{ github.workspace }}/.e2e-kubeconfig
      # Облачная часть — OpenTofu: провайдер читает YC_*, бэкенд state — ключ
      # бакета в AWS_*-переменных (S3-совместимый Object Storage).
      YC_SERVICE_ACCOUNT_KEY_FILE: ${{ github.workspace }}/.yc-key.json
      YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
      YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
      E2E_STATE_BUCKET: ${{ vars.E2E_STATE_BUCKET || 'traumtech-paas-e2e-state' }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: stable

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - name: Ключ сервисного аккаунта облака
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
        run: printf '%s' "$YC_SA_KEY" > "$YC_SERVICE_ACCOUNT_KEY_FILE"

      - name: Поднять кластер прогона
        run: hack/cluster-up.sh

      - name: Сценарии, которым нужен кластер
        run: go test -v -tags cluster -timeout 25m ./...

      # Снос обязан случиться и после падения: иначе машина останется работать,
      # а следующий прогон встанет на занятом адресе.
      - name: Снести кластер прогона
        if: always()
        run: hack/cluster-down.sh
